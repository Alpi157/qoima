# Production stack: PostgreSQL, API, Caddy with the frontend.
# Run from the repo root: docker compose -f deploy/docker-compose.prod.yml up -d --build
# Settings: deploy/.env.prod (template: deploy/.env.prod.example).

name: qoima

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      COOKIE_SECURE: "true"
      ENABLE_DOCS: "false"
      # Only Caddy (fixed address below) may set the client IP via X-Forwarded-For.
      # Not the whole subnet: its gateway 172.30.0.1 is how the host reaches containers.
      FORWARDED_ALLOW_IPS: "172.30.0.10"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      internal:
        ipv4_address: 172.30.0.10
    logging: *logging

networks:
  internal:
    ipam:
      config:
        # Fixed subnet so web gets a fixed address for FORWARDED_ALLOW_IPS.
        - subnet: 172.30.0.0/24

volumes:
  db_data:
  caddy_data:
  caddy_config:

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qoima
          POSTGRES_PASSWORD: qoima
          POSTGRES_DB: qoima
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qoima -d qoima"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://qoima:qoima@localhost:5432/qoima
      TEST_DATABASE_URL: postgresql+psycopg://qoima:qoima@localhost:5432/qoima_test
      SECRET_KEY: ci-secret-key
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Create test database
        run: PGPASSWORD=qoima psql -h localhost -U qoima -d qoima -c "CREATE DATABASE qoima_test;"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Run tests
        working-directory: backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Prettier check
        working-directory: frontend
        run: npm run format:check

      - name: Build
        working-directory: frontend
        run: npm run build
